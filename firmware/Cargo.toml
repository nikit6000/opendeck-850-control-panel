[package]
name = "cdj850-panel-adapter"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
critical-section = "1"
panic-halt = "1"
heapless = "0.9"
stm32f4xx-hal = { version = "0.23", features = ["stm32f401", "usb_fs"] }
usb-device = "0.3"
usbd-serial = "0.2"

[profile.release]
opt-level = "s"
debug = true
lto = true
codegen-units = 1
